---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-agent
  namespace: flux-system
spec:
  dependsOn:
    - name: gateways
    - name: linstor-cluster
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/bee/hermes-agent/base
  prune: false
  wait: true
  # Cluster network facts, kept in one place per env instead of hardcoded in the manifests.
  postBuild:
    substitute:
      podCIDR: 10.244.0.0/16
      serviceCIDR: 10.96.0.0/12
      dnsServiceIP: 10.96.0.10
      lanCIDR: 192.168.10.0/24
      gatewayVIP: 192.168.10.10
