# Waits for every infrastructure unit an app may rely on (storage, secrets, gateway).
# Once apps exist, give each its own Kustomization at apps/bee/<app>/<env> with
# dependsOn limited to what that app uses, and drop this catch-all.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: linstor-cluster
    - name: external-secrets-store
    - name: nginx-gateway-fabric
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/bee/development
  prune: false
  wait: true
