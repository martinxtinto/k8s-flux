---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: degoog
  namespace: flux-system
spec:
  dependsOn:
    - name: gateways
    - name: external-secrets-store
    - name: linstor-cluster
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/bee/degoog/base
  prune: false
  wait: true
