---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-test
  namespace: flux-system
spec:
  dependsOn:
    - name: linstor-cluster
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/bee/storage-test/base
  prune: true   # PVs are Retain, so pruning the PVCs never destroys data
  wait: true
