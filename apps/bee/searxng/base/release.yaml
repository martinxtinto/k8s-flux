---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: searxng
  namespace: flux-system
spec:
  interval: 24h
  url: https://self-hosters-by-night.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: searxng
  chart:
    spec:
      chart: searxng
      version: 1.3.1
      sourceRef:
        kind: HelmRepository
        name: searxng
        namespace: flux-system
      interval: 24h
  install:
    createNamespace: true
  values:
    fullnameOverride: searxng
    # Rendered into a ConfigMap and written to /etc/searxng/settings.yml by the chart's init container.
    settings: |
      use_default_settings: true

      server:
        # The authoritative secret key is injected from Bitwarden via the SEARXNG_SECRET environment
        # variable (environment variables win over settings.yml), so this placeholder is irrelevant at
        # runtime and only exists because the chart's init container expects it.
        secret_key: "ultrasecretkey"
        base_url: https://searxng.xtinto.com/
        image_proxy: true

      search:
        formats:
          - html
          - json
    env:
      fromSecret:
        # `searxng-secret` is produced by the ExternalSecret in secrets.yaml.
        SEARXNG_SECRET:
          from: searxng-secret
          key: secret-key
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
