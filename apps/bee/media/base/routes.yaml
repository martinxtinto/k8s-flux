---
# All media UIs share the wildcard certificate on the `xtinto.com-https` listener. Each app keeps
# its own built-in authentication; there is no gateway-level auth layer.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  parentRefs:
    - name: bee-gateway
      namespace: gateways
      sectionName: xtinto.com-https
  hostnames:
    - jellyfin.xtinto.com
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
---
