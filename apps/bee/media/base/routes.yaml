---
# Jellyfin remains the media server; Arrmada is the library manager and request portal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  parentRefs:
    - name: bee-gateway
      namespace: gateways
      sectionName: xtinto.com-https
  hostnames:
    - jellyfin.xtinto.com
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: arrmada
  namespace: media
spec:
  parentRefs:
    - name: bee-gateway
      namespace: gateways
      sectionName: xtinto.com-https
  hostnames:
    - arrmada.xtinto.com
  rules:
    - backendRefs:
        - name: arrmada
          port: 7878
---
---
# Prowlarr indexer manager web UI. Arrmada reaches the API over the pod network; this route is
# only for the UI, so indexer definitions can be edited by hand.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: media
spec:
  parentRefs:
    - name: bee-gateway
      namespace: gateways
      sectionName: xtinto.com-https
  hostnames:
    - prowlarr.xtinto.com
  rules:
    - backendRefs:
        - name: arrmada-prowlarr
          port: 9696
---
# Arrmada restores database backups by upload; the gateway default body limit is too small.
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: arrmada
  namespace: media
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: arrmada
  body:
    maxSize: "0"
