---
# One shared media library and download tree, mounted by every app that needs the same files.
# ReadWriteMany uses LINSTOR's NFS export, so Jellyfin, the *arr apps and qBittorrent can run on
# either node without a Multi-Attach deadlock. Downloads and the library live on the same
# filesystem so hardlinks and atomic moves work during imports.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: replicated
  resources:
    requests:
      storage: 250Gi
---
# Per-app configuration. The *arr apps keep their SQLite databases and API keys here; Jellyfin
# keeps metadata and library configuration here. Each claim is small, so two replicas are cheap.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: replicated
  resources:
    requests:
      storage: 10Gi
