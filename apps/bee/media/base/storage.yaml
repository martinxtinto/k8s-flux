---
# One shared media library and download tree, mounted by Jellyfin and Arrmada's download stack.
# ReadWriteMany uses LINSTOR's NFS export, so Jellyfin, Arrmada and qBittorrent can run on either
# node without a Multi-Attach deadlock. Arrmada and qBittorrent both mount it at /storage so
# imports hardlink instead of copying.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: replicated
  resources:
    requests:
      storage: 250Gi
---
# Jellyfin metadata and library configuration.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: replicated
  resources:
    requests:
      storage: 10Gi
---
# Arrmada's database, backups and settings.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arrmada-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: replicated
  resources:
    requests:
      storage: 20Gi
---
# qBittorrent settings and torrent list. Downloads live on media-data, not here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arrmada-qbittorrent-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: replicated
  resources:
    requests:
      storage: 2Gi
---
# Prowlarr settings, indexer definitions and credentials.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arrmada-prowlarr-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: replicated
  resources:
    requests:
      storage: 2Gi
