---
# Reuses the admin token the old instance already keeps in Bitwarden. SMTP is not configured yet;
# add smtp-user/smtp-pass here (and the smtp block in release.yaml) when it is.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-secrets
  namespace: vaultwarden
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: vaultwarden-secrets
  data:
    - secretKey: admin-pass
      remoteRef:
        key: vaultwarden-secrets/admin-pass
