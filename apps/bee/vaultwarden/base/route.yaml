---
# Flux names the release `<targetNamespace>-<name>` (`vaultwarden-vaultwarden`), which contains the
# chart name, so the chart's Service is named after the release. The wildcard certificate on the
# listener covers passwords.xtinto.com.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  parentRefs:
    - name: bee-gateway
      namespace: gateways
      sectionName: xtinto.com-https
  hostnames:
    - passwords.xtinto.com
  rules:
    - backendRefs:
        - name: vaultwarden-vaultwarden
          port: 80
