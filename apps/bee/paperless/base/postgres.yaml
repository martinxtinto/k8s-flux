---
# Paperless's PostgreSQL database: a single instance on a LINSTOR-replicated volume is plenty for a
# homelab document archive, and Paperless runs its migrations automatically on startup. PostgreSQL 18
# is the version the upstream Compose files ship. The password comes from
# the ExternalSecret in secrets.yaml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paperless-postgres
  namespace: paperless
spec:
  serviceName: paperless-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-postgres
    spec:
      securityContext:
        # 70 is the postgres uid/gid in the Alpine image; the image supports starting as non-root.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: paperless
            - name: POSTGRES_DB
              value: paperless
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - paperless
                - -d
                - paperless
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - paperless
                - -d
                - paperless
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            # PostgreSQL 18 images keep PGDATA in a major-version subdirectory
            # (/var/lib/postgresql/18/docker), away from lost+found and ready for pg_upgrade.
            - name: data
              mountPath: /var/lib/postgresql
            # When not running as root, PostgreSQL still needs a writable socket directory.
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: replicated
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-postgres
  namespace: paperless
spec:
  selector:
    app.kubernetes.io/name: paperless-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
