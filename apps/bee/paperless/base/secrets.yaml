---
# Paperless signs sessions and tokens with PAPERLESS_SECRET_KEY and connects to PostgreSQL with a
# password; both are generated once and kept in Bitwarden Secrets Manager. Flow:
#   1. Job `paperless-secrets` creates the `paperless-secrets-bootstrap` Secret with fresh random
#      values (no-op if it already exists).
#   2. PushSecret pushes them to Bitwarden, only if `paperless/*` does not exist yet
#      (updatePolicy: IfNotExists), so existing values are never overwritten.
#   3. ExternalSecret pulls the authoritative values back into `paperless-secrets`, which both
#      PostgreSQL and Paperless consume.
# On a rebuilt cluster the Bitwarden items already exist, so the key and the database password stay
# the same and existing sessions and API tokens remain valid. The one manually managed item is
# `paperless/oidc-client-secret` (see below).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperless-secrets
  namespace: paperless
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paperless-secrets
  namespace: paperless
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - paperless-secrets-bootstrap
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperless-secrets
  namespace: paperless
subjects:
  - kind: ServiceAccount
    name: paperless-secrets
    namespace: paperless
roleRef:
  kind: Role
  name: paperless-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-secrets-script
  namespace: paperless
data:
  generate.py: |
    import base64
    import json
    import os
    import secrets
    import ssl
    import sys
    import urllib.error
    import urllib.request

    NAMESPACE = "paperless"
    SECRET_NAME = "paperless-secrets-bootstrap"

    # Hex keeps both values safe in environment variables without any escaping.
    values = {
        "PAPERLESS_SECRET_KEY": secrets.token_hex(32),
        "POSTGRES_PASSWORD": secrets.token_hex(32),
    }

    sa_dir = "/var/run/secrets/kubernetes.io/serviceaccount"
    token = open(os.path.join(sa_dir, "token"), encoding="utf-8").read().strip()
    host = os.environ["KUBERNETES_SERVICE_HOST"]
    port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
    api = f"https://{host}:{port}"
    context = ssl.create_default_context(cafile=os.path.join(sa_dir, "ca.crt"))
    headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

    def request(method, url, body=None):
        req = urllib.request.Request(url, data=body, method=method, headers=headers)
        return urllib.request.urlopen(req, context=context, timeout=30)

    secret_url = f"{api}/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}"

    # If the bootstrap secret already exists, leave it untouched so the pushed values are stable.
    try:
        request("GET", secret_url)
        print("bootstrap secret already exists; nothing to do")
        sys.exit(0)
    except urllib.error.HTTPError as err:
        if err.code != 404:
            raise

    body = json.dumps(
        {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": SECRET_NAME, "namespace": NAMESPACE},
            "type": "Opaque",
            "data": {key: base64.b64encode(value.encode()).decode() for key, value in values.items()},
        }
    ).encode()

    request("POST", f"{api}/api/v1/namespaces/{NAMESPACE}/secrets", body)
    print(f"created bootstrap secret {NAMESPACE}/{SECRET_NAME}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: paperless-secrets
  namespace: paperless
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-secrets
    spec:
      restartPolicy: OnFailure
      serviceAccountName: paperless-secrets
      # The main container receives a short-lived projected token explicitly (volume below) instead
      # of the auto-mounted one.
      automountServiceAccountToken: false
      containers:
        - name: create-secret
          image: python:3.13-alpine
          command:
            - python3
            - /scripts/generate.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: paperless-secrets-script
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: paperless-secrets
  namespace: paperless
spec:
  refreshInterval: 48h
  # Never overwrite an existing Bitwarden item.
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: bitwarden-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: paperless-secrets-bootstrap
  data:
    - match:
        secretKey: PAPERLESS_SECRET_KEY
        remoteRef:
          remoteKey: paperless/PAPERLESS_SECRET_KEY
    - match:
        secretKey: POSTGRES_PASSWORD
        remoteRef:
          remoteKey: paperless/POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secrets
  namespace: paperless
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: paperless-secrets
  data:
    - secretKey: PAPERLESS_SECRET_KEY
      remoteRef:
        key: paperless/PAPERLESS_SECRET_KEY
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: paperless/POSTGRES_PASSWORD
---
# `paperless/oidc-client-secret` is created manually in Bitwarden from Kanidm's
# `kanidm system oauth2 show-basic-secret paperless` output. The template renders the whole
# django-allauth provider configuration, which Paperless reads as PAPERLESS_SOCIALACCOUNT_PROVIDERS:
#   - PKCE stays enabled, and Kanidm's default ES256 ID token signature is verified via its JWKS.
#   - `groups_name` makes Kanidm send a `groups` claim with short group names, which Paperless uses
#     to grant superuser status to members of `paperless_admins` on every login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-oidc
  namespace: paperless
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: paperless-oidc
    template:
      engineVersion: v2
      data:
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
          {"openid_connect": {"SCOPE": ["openid", "profile", "email", "groups_name"],
          "OAUTH_PKCE_ENABLED": true, "APPS": [{"provider_id": "kanidm", "name": "Kanidm",
          "client_id": "paperless", "secret": "{{ .clientSecret }}",
          "settings": {"server_url": "https://idm.xtinto.com/oauth2/openid/paperless"}}]}}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: paperless/oidc-client-secret
