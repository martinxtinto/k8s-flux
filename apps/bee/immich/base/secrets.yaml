---
# The PostgreSQL password is generated once and kept in Bitwarden Secrets Manager. Flow:
#   1. Job `immich-secrets` creates the `immich-secrets-bootstrap` Secret with a fresh random
#      value (no-op if it already exists).
#   2. PushSecret pushes it to Bitwarden, only if `immich/POSTGRES_PASSWORD` does not exist yet
#      (updatePolicy: IfNotExists), so an existing value is never overwritten.
#   3. ExternalSecret pulls the authoritative value back into `immich-secrets`, which both the
#      PostgreSQL StatefulSet and the HelmRelease (as DB_PASSWORD) consume.
# On a rebuilt cluster the Bitwarden item already exists, so the password stays the same. The
# password is hex-only, so it needs no escaping anywhere it is embedded. Immich's OAuth settings
# live in the database and travel with the migrated dump, so there is no OIDC ExternalSecret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: immich-secrets
  namespace: immich
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: immich-secrets
  namespace: immich
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - immich-secrets-bootstrap
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: immich-secrets
  namespace: immich
subjects:
  - kind: ServiceAccount
    name: immich-secrets
    namespace: immich
roleRef:
  kind: Role
  name: immich-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-secrets-script
  namespace: immich
data:
  generate.py: |
    import base64
    import json
    import os
    import secrets
    import ssl
    import sys
    import urllib.error
    import urllib.request

    NAMESPACE = "immich"
    SECRET_NAME = "immich-secrets-bootstrap"

    values = {
        "POSTGRES_PASSWORD": secrets.token_hex(32),
    }

    sa_dir = "/var/run/secrets/kubernetes.io/serviceaccount"
    token = open(os.path.join(sa_dir, "token"), encoding="utf-8").read().strip()
    host = os.environ["KUBERNETES_SERVICE_HOST"]
    port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
    api = f"https://{host}:{port}"
    context = ssl.create_default_context(cafile=os.path.join(sa_dir, "ca.crt"))
    headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

    def request(method, url, body=None):
        req = urllib.request.Request(url, data=body, method=method, headers=headers)
        return urllib.request.urlopen(req, context=context, timeout=30)

    secret_url = f"{api}/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}"

    # If the bootstrap secret already exists, leave it untouched so the pushed value is stable.
    try:
        request("GET", secret_url)
        print("bootstrap secret already exists; nothing to do")
        sys.exit(0)
    except urllib.error.HTTPError as err:
        if err.code != 404:
            raise

    body = json.dumps(
        {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": SECRET_NAME, "namespace": NAMESPACE},
            "type": "Opaque",
            "data": {key: base64.b64encode(value.encode()).decode() for key, value in values.items()},
        }
    ).encode()

    request("POST", f"{api}/api/v1/namespaces/{NAMESPACE}/secrets", body)
    print(f"created bootstrap secret {NAMESPACE}/{SECRET_NAME}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-secrets
  namespace: immich
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-secrets
    spec:
      restartPolicy: OnFailure
      serviceAccountName: immich-secrets
      # The main container receives a short-lived projected token explicitly (volume below) instead
      # of the auto-mounted one.
      automountServiceAccountToken: false
      containers:
        - name: create-secret
          image: python:3.13-alpine
          command:
            - python3
            - /scripts/generate.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: immich-secrets-script
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: immich-secrets
  namespace: immich
spec:
  refreshInterval: 48h
  # Never overwrite an existing Bitwarden item.
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: bitwarden-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: immich-secrets-bootstrap
  data:
    - match:
        secretKey: POSTGRES_PASSWORD
        remoteRef:
          remoteKey: immich/POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-secrets
  namespace: immich
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: immich-secrets
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: immich/POSTGRES_PASSWORD
