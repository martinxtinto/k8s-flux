---
# photos.xtinto.com behind the shared bee-gateway. The server Service is named after the chart
# component (`<release>-server`, i.e. `immich-immich-server`).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - name: bee-gateway
      namespace: gateways
      sectionName: xtinto.com-https
  hostnames:
    - photos.xtinto.com
  rules:
    - backendRefs:
        - name: immich-immich-server
          port: 2283
---
# NGINX's default client_max_body_size would reject anything but tiny uploads; 0 disables the
# limit for photo/video uploads on this route only.
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: immich
  namespace: immich
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: immich
  body:
    maxSize: "0"
