---
# Immich's PostgreSQL database. The image is the exact one the source instance runs, so the
# migrated dump restores against identical server/extensions (PostgreSQL 14 with VectorChord
# 0.4.3 and pgvecto.rs 0.2.0); the server runs its migrations automatically on startup. A single
# instance on a LINSTOR-replicated volume is plenty for a homelab. The password comes from the
# ExternalSecret in secrets.yaml.
#
# The image's entrypoint writes its tuned postgresql.conf into /etc/postgresql (chmod 1777 and
# owned by postgres in the image), so it can start as the non-root postgres user like the rest of
# the stack.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
  namespace: immich
spec:
  serviceName: immich-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-postgres
    spec:
      securityContext:
        # 999 is the postgres uid/gid in the Debian-based image.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: POSTGRES_PASSWORD
            # Matches the upstream docker-compose and makes checksum failures detectable.
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            # A subdirectory keeps initdb away from any lost+found on the volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - immich
                - -d
                - immich
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - immich
                - -d
                - immich
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # When not running as root, PostgreSQL still needs a writable socket directory.
            - name: run
              mountPath: /var/run/postgresql
            # Upstream's compose gives the container 128Mi of /dev/shm; Kubernetes defaults to 64Mi.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: run
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: replicated
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
