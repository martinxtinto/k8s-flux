---
# hermes.xtinto.com, behind the shared bee-gateway. Two backends share the hostname:
#   - /api/v1/*  -> the OpenAI-compatible API server, rewritten to /v1/* upstream
#   - everything else -> the web dashboard UI and its own management API, at the site root
# The OpenAI-compatible API server's native /api/* management endpoints are intentionally NOT
# exposed; only /v1/* is reachable. The dashboard is served at the origin root because its SPA
# build emits root-absolute asset and login URLs, which cannot survive a prefixed mount.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  parentRefs:
    - name: bee-gateway
      namespace: gateways
      sectionName: xtinto.com-https
  hostnames:
    - hermes.xtinto.com
  rules:
    # OpenAI-compatible API: base URL for clients is https://hermes.xtinto.com/api/v1.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1
      backendRefs:
        - name: hermes-agent
          port: 8642
    # Everything else: the web dashboard, served at the origin root (no prefix rewrite).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hermes-agent
          port: 9119
