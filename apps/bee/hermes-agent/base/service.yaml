---
# Both surfaces of the pod. The HTTPRoute (route.yaml) sends /api/v1 to the API server and
# /dashboard to the web dashboard; the NetworkPolicy (netpol.yaml) only admits the gateway's
# data-plane pods.
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes-agent
  ports:
    - name: api
      port: 8642
      targetPort: api
    - name: dashboard
      port: 9119
      targetPort: dashboard
