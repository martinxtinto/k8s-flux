---
apiVersion: v1
kind: Service
metadata:
  name: kanidm
  namespace: kanidm
spec:
  selector:
    app.kubernetes.io/name: kanidm
  ports:
    - name: https
      port: 8443
      targetPort: https
    # In-cluster LDAPS for apps that integrate over LDAP; not exposed via the gateway.
    - name: ldaps
      port: 3636
      targetPort: ldaps
