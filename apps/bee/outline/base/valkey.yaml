---
# Outline uses the Redis protocol only for caches, rate limiting and websocket pub/sub, so the data
# is disposable: Valkey runs with persistence disabled on an emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline-valkey
  namespace: outline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outline-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline-valkey
    spec:
      securityContext:
        # The image creates the valkey user as uid 999/gid 1000 and can start as non-root.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          # The entrypoint prepends `valkey-server` when the first argument is an option.
          args:
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: outline-valkey
  namespace: outline
spec:
  selector:
    app.kubernetes.io/name: outline-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
