---
# Outline keeps documents in PostgreSQL and uploaded files under /var/lib/outline/data, so the app
# state survives restarts on a LINSTOR-replicated volume. Migrations run automatically on first
# start and the database credentials come from the ExternalSecret in secrets.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: outline-data
  namespace: outline
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: replicated
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline
  namespace: outline
spec:
  replicas: 1
  # The data PVC is ReadWriteOnce; Recreate tears the old pod down before starting the new one so a
  # rollout can never deadlock on Multi-Attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: outline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline
    spec:
      securityContext:
        # 1001 is the nodejs user in the image, which also owns the local storage root.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outline
          image: outlinewiki/outline:1.10.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: URL
              value: https://outline.xtinto.com
            - name: PORT
              value: "3000"
            - name: WEB_CONCURRENCY
              value: "1"
            # Skip the anonymized update checks; this instance is updated via GitOps.
            - name: ENABLE_UPDATES
              value: "false"
            # Database and credentials are owned by the ExternalSecret in secrets.yaml.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outline-secrets
                  key: DATABASE_URL
            # The database is in-cluster and does not speak TLS.
            - name: PGSSLMODE
              value: disable
            - name: REDIS_URL
              value: redis://outline-valkey:6379
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: outline-secrets
                  key: SECRET_KEY
            - name: UTILS_SECRET
              valueFrom:
                secretKeyRef:
                  name: outline-secrets
                  key: UTILS_SECRET
            # Uploads and imports live on the data volume. The default upload limit is only 1MB, and
            # the workspace import limit caps the JSON export zip that can be imported.
            - name: FILE_STORAGE
              value: local
            - name: FILE_STORAGE_LOCAL_ROOT_DIR
              value: /var/lib/outline/data
            - name: FILE_STORAGE_UPLOAD_MAX_SIZE
              value: "262144000"
            - name: FILE_STORAGE_WORKSPACE_IMPORT_MAX_SIZE
              value: "2147483648"
            # Kanidm is the only identity provider: no email/SMTP and no local signups. The OAuth2
            # client `outline` already exists in Kanidm; the secret comes from Bitwarden.
            - name: OIDC_CLIENT_ID
              value: outline
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: outline-oidc
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_ISSUER_URL
              value: https://idm.xtinto.com/oauth2/openid/outline
            - name: OIDC_DISPLAY_NAME
              value: Kanidm
            - name: OIDC_SCOPES
              value: openid profile email
          # The first start runs database migrations; allow plenty of time before liveness kicks in.
          startupProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/outline/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: outline-data
---
apiVersion: v1
kind: Service
metadata:
  name: outline
  namespace: outline
spec:
  selector:
    app.kubernetes.io/name: outline
  ports:
    - name: http
      port: 3000
      targetPort: http
