---
# Outline's PostgreSQL database: a single instance on a LINSTOR-replicated volume is plenty for a
# homelab wiki, and Outline runs its migrations automatically on startup. The password comes from
# the ExternalSecret in secrets.yaml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: outline-postgres
  namespace: outline
spec:
  serviceName: outline-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outline-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline-postgres
    spec:
      securityContext:
        # 70 is the postgres uid/gid in the Alpine image; the image supports starting as non-root.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: outline
            - name: POSTGRES_DB
              value: outline
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outline-secrets
                  key: POSTGRES_PASSWORD
            # A subdirectory keeps initdb away from any lost+found on the volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - outline
                - -d
                - outline
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - outline
                - -d
                - outline
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # When not running as root, PostgreSQL still needs a writable socket directory.
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: replicated
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: outline-postgres
  namespace: outline
spec:
  selector:
    app.kubernetes.io/name: outline-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
