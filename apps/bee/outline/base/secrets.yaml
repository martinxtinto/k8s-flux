---
# Outline requires SECRET_KEY to be exactly 64 hexadecimal characters, signs sessions with
# UTILS_SECRET and connects to PostgreSQL with a password; all of it is generated once and kept in
# Bitwarden Secrets Manager. Flow:
#   1. Job `outline-secrets` creates the `outline-secrets-bootstrap` Secret with fresh random
#      values (no-op if it already exists).
#   2. PushSecret pushes them to Bitwarden, only if `outline/*` does not exist yet
#      (updatePolicy: IfNotExists), so existing values are never overwritten.
#   3. ExternalSecret pulls the authoritative values back into `outline-secrets`, which both
#      PostgreSQL and Outline consume. DATABASE_URL embeds the hex-only password, so it needs no
#      URL escaping.
# On a rebuilt cluster the Bitwarden items already exist, so the keys and the database password
# stay the same and existing sessions and encrypted data remain valid. The one manually managed
# item is `outline/oidc-client-secret` (see below).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: outline-secrets
  namespace: outline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: outline-secrets
  namespace: outline
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - outline-secrets-bootstrap
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: outline-secrets
  namespace: outline
subjects:
  - kind: ServiceAccount
    name: outline-secrets
    namespace: outline
roleRef:
  kind: Role
  name: outline-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: outline-secrets-script
  namespace: outline
data:
  generate.py: |
    import base64
    import json
    import os
    import secrets
    import ssl
    import sys
    import urllib.error
    import urllib.request

    NAMESPACE = "outline"
    SECRET_NAME = "outline-secrets-bootstrap"

    # SECRET_KEY must be exactly 64 hex characters (32 bytes); UTILS_SECRET and the database
    # password use the same format so the DATABASE_URL never needs URL escaping.
    values = {
        "SECRET_KEY": secrets.token_hex(32),
        "UTILS_SECRET": secrets.token_hex(32),
        "POSTGRES_PASSWORD": secrets.token_hex(32),
    }
    values["DATABASE_URL"] = (
        f"postgres://outline:{values['POSTGRES_PASSWORD']}@outline-postgres:5432/outline"
    )

    sa_dir = "/var/run/secrets/kubernetes.io/serviceaccount"
    token = open(os.path.join(sa_dir, "token"), encoding="utf-8").read().strip()
    host = os.environ["KUBERNETES_SERVICE_HOST"]
    port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
    api = f"https://{host}:{port}"
    context = ssl.create_default_context(cafile=os.path.join(sa_dir, "ca.crt"))
    headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

    def request(method, url, body=None):
        req = urllib.request.Request(url, data=body, method=method, headers=headers)
        return urllib.request.urlopen(req, context=context, timeout=30)

    secret_url = f"{api}/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}"

    # If the bootstrap secret already exists, leave it untouched so the pushed values are stable.
    try:
        request("GET", secret_url)
        print("bootstrap secret already exists; nothing to do")
        sys.exit(0)
    except urllib.error.HTTPError as err:
        if err.code != 404:
            raise

    body = json.dumps(
        {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": SECRET_NAME, "namespace": NAMESPACE},
            "type": "Opaque",
            "data": {key: base64.b64encode(value.encode()).decode() for key, value in values.items()},
        }
    ).encode()

    request("POST", f"{api}/api/v1/namespaces/{NAMESPACE}/secrets", body)
    print(f"created bootstrap secret {NAMESPACE}/{SECRET_NAME}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: outline-secrets
  namespace: outline
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline-secrets
    spec:
      restartPolicy: OnFailure
      serviceAccountName: outline-secrets
      # The main container receives a short-lived projected token explicitly (volume below) instead
      # of the auto-mounted one.
      automountServiceAccountToken: false
      containers:
        - name: create-secret
          image: python:3.13-alpine
          command:
            - python3
            - /scripts/generate.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: outline-secrets-script
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: outline-secrets
  namespace: outline
spec:
  refreshInterval: 48h
  # Never overwrite an existing Bitwarden item.
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: bitwarden-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: outline-secrets-bootstrap
  data:
    - match:
        secretKey: SECRET_KEY
        remoteRef:
          remoteKey: outline/SECRET_KEY
    - match:
        secretKey: UTILS_SECRET
        remoteRef:
          remoteKey: outline/UTILS_SECRET
    - match:
        secretKey: POSTGRES_PASSWORD
        remoteRef:
          remoteKey: outline/POSTGRES_PASSWORD
    - match:
        secretKey: DATABASE_URL
        remoteRef:
          remoteKey: outline/DATABASE_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-secrets
  namespace: outline
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: outline-secrets
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: outline/SECRET_KEY
    - secretKey: UTILS_SECRET
      remoteRef:
        key: outline/UTILS_SECRET
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: outline/POSTGRES_PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: outline/DATABASE_URL
---
# `outline/oidc-client-secret` is created manually in Bitwarden from Kanidm's
# `kanidm system oauth2 show-basic-secret outline` output; the OAuth2 client itself already exists
# in Kanidm with the `https://outline.xtinto.com/auth/oidc.callback` redirect URL. The secret is
# consumed as OIDC_CLIENT_SECRET by the Deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-oidc
  namespace: outline
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: outline-oidc
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: outline/oidc-client-secret
