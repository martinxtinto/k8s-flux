---
# Open WebUI signs its JWTs and encrypts stored OAuth tokens with WEBUI_SECRET_KEY. The key is
# generated once and kept in Bitwarden Secrets Manager. Flow:
#   1. Job `openwebui-secrets` creates the `openwebui-secrets-bootstrap` Secret with a fresh random
#      value (no-op if it already exists).
#   2. PushSecret pushes it to Bitwarden, only if `openwebui/WEBUI_SECRET_KEY` does not exist yet
#      (updatePolicy: IfNotExists), so an existing value is never overwritten.
#   3. ExternalSecret pulls the authoritative value back into `openwebui-secrets`, which the
#      HelmRelease consumes as a required WEBUI_SECRET_KEY environment variable.
# On a rebuilt cluster the Bitwarden item already exists, so the key stays the same and sessions and
# encrypted OAuth tokens remain valid. The one manually managed item is
# `openwebui/oidc-client-secret` (see below).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openwebui-secrets
  namespace: openwebui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openwebui-secrets
  namespace: openwebui
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - openwebui-secrets-bootstrap
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openwebui-secrets
  namespace: openwebui
subjects:
  - kind: ServiceAccount
    name: openwebui-secrets
    namespace: openwebui
roleRef:
  kind: Role
  name: openwebui-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-secrets-script
  namespace: openwebui
data:
  generate.py: |
    import base64
    import json
    import os
    import secrets
    import ssl
    import sys
    import urllib.error
    import urllib.request

    NAMESPACE = "openwebui"
    SECRET_NAME = "openwebui-secrets-bootstrap"

    # Any length is accepted (it is hashed into a Fernet key), but a 32-byte hex value is both
    # plenty and safe to embed in every place the chart passes it through.
    values = {
        "WEBUI_SECRET_KEY": secrets.token_hex(32),
    }

    sa_dir = "/var/run/secrets/kubernetes.io/serviceaccount"
    token = open(os.path.join(sa_dir, "token"), encoding="utf-8").read().strip()
    host = os.environ["KUBERNETES_SERVICE_HOST"]
    port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
    api = f"https://{host}:{port}"
    context = ssl.create_default_context(cafile=os.path.join(sa_dir, "ca.crt"))
    headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

    def request(method, url, body=None):
        req = urllib.request.Request(url, data=body, method=method, headers=headers)
        return urllib.request.urlopen(req, context=context, timeout=30)

    secret_url = f"{api}/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}"

    # If the bootstrap secret already exists, leave it untouched so the pushed value is stable.
    try:
        request("GET", secret_url)
        print("bootstrap secret already exists; nothing to do")
        sys.exit(0)
    except urllib.error.HTTPError as err:
        if err.code != 404:
            raise

    body = json.dumps(
        {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": SECRET_NAME, "namespace": NAMESPACE},
            "type": "Opaque",
            "data": {key: base64.b64encode(value.encode()).decode() for key, value in values.items()},
        }
    ).encode()

    request("POST", f"{api}/api/v1/namespaces/{NAMESPACE}/secrets", body)
    print(f"created bootstrap secret {NAMESPACE}/{SECRET_NAME}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openwebui-secrets
  namespace: openwebui
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openwebui-secrets
    spec:
      restartPolicy: OnFailure
      serviceAccountName: openwebui-secrets
      # The main container receives a short-lived projected token explicitly (volume below) instead
      # of the auto-mounted one.
      automountServiceAccountToken: false
      containers:
        - name: create-secret
          image: python:3.13-alpine
          command:
            - python3
            - /scripts/generate.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: openwebui-secrets-script
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: openwebui-secrets
  namespace: openwebui
spec:
  refreshInterval: 48h
  # Never overwrite an existing Bitwarden item.
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: bitwarden-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: openwebui-secrets-bootstrap
  data:
    - match:
        secretKey: WEBUI_SECRET_KEY
        remoteRef:
          remoteKey: openwebui/WEBUI_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-secrets
  namespace: openwebui
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: openwebui-secrets
  data:
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: openwebui/WEBUI_SECRET_KEY
---
# `openwebui/oidc-client-secret` is created manually in Bitwarden from Kanidm's
# `kanidm system oauth2 show-basic-secret openwebui` output. It owns a dedicated Secret consumed by
# the chart's sso.oidc.clientExistingSecret (required, not optional), so the pod cannot start until
# External Secrets has written it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-oidc
  namespace: openwebui
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: openwebui-oidc
  data:
    - secretKey: OPENID_CLIENT_SECRET
      remoteRef:
        key: openwebui/oidc-client-secret
