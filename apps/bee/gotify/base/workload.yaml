---
# Gotify on push.xtinto.com. SQLite, uploaded images and plugins live on the `gotify-data` PVC.
# Local password login stays enabled for the `admin` account created on first boot; Kanidm OIDC is
# the login path for members of the `gotify_users` group. The admin password is generated once and
# kept in Bitwarden (see secrets.yaml); it is only used when the database is first created.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotify
  namespace: gotify
spec:
  replicas: 1
  # The data PVC is ReadWriteOnce; Recreate tears the old pod down before starting the new one so a
  # rollout can never deadlock on Multi-Attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gotify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gotify
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gotify
          image: gotify/server:3.1.1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: America/Argentina/Buenos_Aires
            # Listen on an unprivileged port so the container does not need NET_BIND_SERVICE.
            - name: GOTIFY_SERVER_PORT
              value: "8080"
            - name: GOTIFY_SERVER_SECURECOOKIE
              value: "true"
            # Trust the gateway for client-IP logging and X-Forwarded-* handling.
            - name: GOTIFY_SERVER_TRUSTEDPROXIES
              value: "[10.244.0.0/16]"
            # Allow the web UI's websocket stream from the wildcard hostname.
            - name: GOTIFY_SERVER_STREAM_ALLOWEDORIGINS
              value: "[.+\\.xtinto\\.com]"
            # Keep the local admin login available alongside OIDC.
            - name: GOTIFY_LOCALAUTH_ENABLED
              value: "true"
            - name: GOTIFY_REGISTRATION
              value: "false"
            - name: GOTIFY_DATABASE_DIALECT
              value: sqlite3
            - name: GOTIFY_DATABASE_CONNECTION
              value: data/gotify.db
            - name: GOTIFY_DEFAULTUSER_NAME
              value: admin
            - name: GOTIFY_DEFAULTUSER_PASS
              valueFrom:
                secretKeyRef:
                  name: gotify-secrets
                  key: GOTIFY_DEFAULTUSER_PASS
            - name: GOTIFY_OIDC_ENABLED
              value: "true"
            - name: GOTIFY_OIDC_ISSUER
              value: https://idm.xtinto.com/oauth2/openid/gotify
            - name: GOTIFY_OIDC_CLIENTID
              value: gotify
            - name: GOTIFY_OIDC_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: gotify-oidc
                  key: OIDC_CLIENT_SECRET
            - name: GOTIFY_OIDC_REDIRECTURL
              value: https://push.xtinto.com/auth/oidc/callback
            - name: GOTIFY_OIDC_AUTOREGISTER
              value: "true"
            - name: GOTIFY_OIDC_USERNAMECLAIM
              value: preferred_username
            - name: GOTIFY_OIDC_SCOPES
              value: openid,profile,email,groups_name
            - name: GOTIFY_OIDC_IDP_NAME
              value: Kanidm
            # Do not auto-redirect to Kanidm: the local admin needs the password form.
            - name: GOTIFY_OIDC_AUTO_REDIRECT
              value: "false"
            # Kanidm's groups_name scope puts the group names in the `groups` claim. Only
            # gotify_users may log in through OIDC; admin stays local.
            - name: GOTIFY_OIDC_GROUPS_CLAIM
              value: groups
            - name: GOTIFY_OIDC_GROUPS_USER
              value: gotify_users
          # /health is unauthenticated and returns 200 once the database is ready.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gotify-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gotify
  namespace: gotify
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gotify
  ports:
    - name: http
      port: 80
      targetPort: http
