---
# Gotify's bootstrap admin password is generated once and kept in Bitwarden Secrets Manager. It is
# only used when Gotify creates its database for the first time; after that the password lives in
# the SQLite database and this value is ignored. Flow:
#   1. Job `gotify-secrets` creates the `gotify-secrets-bootstrap` Secret with a fresh random
#      password (no-op if it already exists).
#   2. PushSecret pushes it to Bitwarden, only if `gotify/DEFAULTUSER_PASS` does not exist yet
#      (updatePolicy: IfNotExists), so an existing value is never overwritten.
#   3. ExternalSecret pulls the authoritative value back into `gotify-secrets`, which the
#      Deployment consumes as GOTIFY_DEFAULTUSER_PASS.
# On a rebuilt cluster the Bitwarden item already exists, so the password stays the same and the
# existing database remains accessible. Keep the Bitwarden item: deleting it makes a fresh database
# use a new password but leaves an existing database with the old one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gotify-secrets
  namespace: gotify
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gotify-secrets
  namespace: gotify
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - gotify-secrets-bootstrap
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gotify-secrets
  namespace: gotify
subjects:
  - kind: ServiceAccount
    name: gotify-secrets
    namespace: gotify
roleRef:
  kind: Role
  name: gotify-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gotify-secrets-script
  namespace: gotify
data:
  generate.py: |
    import base64
    import json
    import os
    import secrets
    import ssl
    import sys
    import urllib.error
    import urllib.request

    NAMESPACE = "gotify"
    SECRET_NAME = "gotify-secrets-bootstrap"

    # 32 random bytes as hex; long enough for Gotify's bcrypt password strength and safe to put in
    # an environment variable.
    values = {
        "GOTIFY_DEFAULTUSER_PASS": secrets.token_hex(32),
    }

    sa_dir = "/var/run/secrets/kubernetes.io/serviceaccount"
    token = open(os.path.join(sa_dir, "token"), encoding="utf-8").read().strip()
    host = os.environ["KUBERNETES_SERVICE_HOST"]
    port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
    api = f"https://{host}:{port}"
    context = ssl.create_default_context(cafile=os.path.join(sa_dir, "ca.crt"))
    headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

    def request(method, url, body=None):
        req = urllib.request.Request(url, data=body, method=method, headers=headers)
        return urllib.request.urlopen(req, context=context, timeout=30)

    secret_url = f"{api}/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}"

    # If the bootstrap secret already exists, leave it untouched so the pushed value is stable.
    try:
        request("GET", secret_url)
        print("bootstrap secret already exists; nothing to do")
        sys.exit(0)
    except urllib.error.HTTPError as err:
        if err.code != 404:
            raise

    body = json.dumps(
        {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": SECRET_NAME, "namespace": NAMESPACE},
            "type": "Opaque",
            "data": {key: base64.b64encode(value.encode()).decode() for key, value in values.items()},
        }
    ).encode()

    request("POST", f"{api}/api/v1/namespaces/{NAMESPACE}/secrets", body)
    print(f"created bootstrap secret {NAMESPACE}/{SECRET_NAME}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gotify-secrets
  namespace: gotify
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gotify-secrets
    spec:
      restartPolicy: OnFailure
      serviceAccountName: gotify-secrets
      # The main container receives a short-lived projected token explicitly (volume below) instead
      # of the auto-mounted one.
      automountServiceAccountToken: false
      containers:
        - name: create-secret
          image: python:3.13-alpine
          command:
            - python3
            - /scripts/generate.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: gotify-secrets-script
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: gotify-secrets
  namespace: gotify
spec:
  refreshInterval: 48h
  # Never overwrite an existing Bitwarden item.
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: bitwarden-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: gotify-secrets-bootstrap
  data:
    - match:
        secretKey: GOTIFY_DEFAULTUSER_PASS
        remoteRef:
          remoteKey: gotify/DEFAULTUSER_PASS
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotify-secrets
  namespace: gotify
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gotify-secrets
  data:
    - secretKey: GOTIFY_DEFAULTUSER_PASS
      remoteRef:
        key: gotify/DEFAULTUSER_PASS
---
# `gotify/oidc-client-secret` is created manually in Bitwarden from Kanidm's
# `kanidm system oauth2 show-basic-secret gotify` output. It owns a dedicated Secret consumed by the
# Deployment as GOTIFY_OIDC_CLIENTSECRET, so the pod waits for it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotify-oidc
  namespace: gotify
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gotify-oidc
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: gotify/oidc-client-secret
