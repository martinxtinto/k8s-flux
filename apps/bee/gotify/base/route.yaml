---
# The wildcard certificate on the `xtinto.com-https` listener covers push.xtinto.com. Kanidm OIDC
# and the local admin password are both available at the app, so no gateway-level auth is needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gotify
  namespace: gotify
spec:
  parentRefs:
    - name: bee-gateway
      namespace: gateways
      sectionName: xtinto.com-https
  hostnames:
    - push.xtinto.com
  rules:
    - backendRefs:
        - name: gotify
          port: 80
