---
# MongoDB runs straight from the official `mongo` image instead of the Bitnami subchart the LibreChat
# chart bundles (Bitnami's versioned images are frozen in the unsupported `bitnamilegacy` archive).
# The official entrypoint's first-boot flow does everything needed here: with
# MONGO_INITDB_ROOT_USERNAME/PASSWORD set it forces `--auth`, starts a temporary unauthenticated
# mongod, creates the root user, runs the scripts below and only then starts the real server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-mongodb-init
  namespace: librechat
data:
  # Sourced by the image entrypoint during first boot, while the temporary mongod still accepts
  # unauthenticated local connections. Creates the unprivileged application user in one shot, so
  # LibreChat never authenticates as root.
  01-create-app-user.sh: |
    mongosh --quiet "$MONGO_INITDB_DATABASE" --eval 'db.createUser({user: "librechat", pwd: process.env.MONGO_APP_PASSWORD, roles: [{role: "readWrite", db: "LibreChat"}]})'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: librechat-mongodb
  namespace: librechat
spec:
  serviceName: librechat-mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: librechat-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: librechat-mongodb
    spec:
      securityContext:
        runAsNonRoot: true
        # Matches the `mongodb` user in the image; also used to own the PVC.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo:8.0.32
          # The entrypoint appends --auth when MONGO_INITDB_ROOT_* is set; passing it here keeps the
          # intent explicit. --wiredTigerCacheSizeGB keeps WiredTiger's host-derived cache default
          # from exceeding the container memory limit.
          args:
            - --auth
            - --wiredTigerCacheSizeGB
            - "0.25"
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librechat-mongodb
                  key: root-password
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librechat-mongodb
                  key: app-password
            - name: MONGO_INITDB_DATABASE
              value: LibreChat
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data/db
            # The entrypoint writes its temporary files under TMPDIR; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: init
          configMap:
            name: librechat-mongodb-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: replicated
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: librechat-mongodb
  namespace: librechat
spec:
  selector:
    app.kubernetes.io/name: librechat-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
