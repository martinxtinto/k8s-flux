---
# Official LibreChat chart, published as an OCI artifact (the packaged chart bundles its Meilisearch
# subchart, which is the only optional component enabled here). MongoDB is deliberately *not* taken
# from the chart: its bundled Bitnami subchart is disabled and replaced by the hand-rolled
# StatefulSet in mongodb.yaml, so no Bitnami images are used anywhere.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: librechat
  namespace: flux-system
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/librechat-ai/librechat-chart
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librechat
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: librechat
  chart:
    spec:
      chart: librechat
      version: 2.0.17
      sourceRef:
        kind: HelmRepository
        name: librechat
        namespace: flux-system
      interval: 24h
  install:
    createNamespace: true
  values:
    fullnameOverride: librechat
    replicaCount: 1
    # Routing is handled by the HTTPRoute in route.yaml, not by an Ingress.
    ingress:
      enabled: false

    global:
      librechat:
        # Holds CREDS_KEY, CREDS_IV, JWT_SECRET, JWT_REFRESH_SECRET, OPENID_SESSION_SECRET,
        # MEILI_MASTER_KEY, METRICS_SECRET and (from its own ExternalSecret) OPENID_CLIENT_SECRET.
        existingSecretName: librechat-credentials-env
        # The chart's envFrom cannot compose the URI from a Secret, and it must never appear in the
        # ConfigMap, so it is injected as an explicit env var (env wins over envFrom).
        env:
          - name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: librechat-mongo-uri
                key: MONGO_URI

    librechat:
      configEnv:
        DOMAIN_CLIENT: https://chat.xtinto.com
        DOMAIN_SERVER: https://chat.xtinto.com
        SEARCH: "true"
        MEILI_NO_ANALYTICS: "true"
        # Kanidm is the only identity provider; local accounts stay disabled. OpenID registration
        # cannot be disabled separately, so access is gated by the Kanidm scope map instead.
        ALLOW_EMAIL_LOGIN: "false"
        ALLOW_REGISTRATION: "false"
        ALLOW_SOCIAL_LOGIN: "true"
        ALLOW_SOCIAL_REGISTRATION: "true"
        OPENID_CLIENT_ID: librechat
        OPENID_ISSUER: https://idm.xtinto.com/oauth2/openid/librechat
        # The app concatenates this with DOMAIN_SERVER; without it the redirect URI ends in
        # the literal "undefined" and Kanidm rejects the request with invalid_origin.
        OPENID_CALLBACK_URL: /oauth/openid/callback
        # `groups_name` adds the `groups` claim (group names only) used for admin mapping below.
        OPENID_SCOPE: openid profile email groups_name
        # Kanidm requires PKCE S256 for every client.
        OPENID_USE_PKCE: "true"
        # Members of the Kanidm group `librechat_admins` get the LibreChat ADMIN role.
        OPENID_ADMIN_ROLE: librechat_admins
        OPENID_ADMIN_ROLE_PARAMETER_PATH: groups
        OPENID_ADMIN_ROLE_TOKEN_KIND: id
      configYamlContent: |
        version: 1.3.17
        cache: true
        registration:
          socialLogins: ["openid"]
      imageVolume:
        enabled: true
        size: 5Gi
        storageClassName: replicated

    # See the hand-rolled StatefulSet in mongodb.yaml.
    mongodb:
      enabled: false

    meilisearch:
      enabled: true
      image:
        # Matches the version pinned by LibreChat's own docker-compose.
        tag: v1.35.1
      persistence:
        enabled: true
        storageClass: replicated
        size: 2Gi
      auth:
        # MEILI_MASTER_KEY from `librechat-credentials-env` must match the app's value.
        existingMasterKeySecret: librechat-credentials-env

    # Single replica; nothing needs shared streams or session storage.
    redis:
      enabled: false
    # Deferred: RAG needs an embeddings provider. When enabled, its bundled PostgreSQL subchart
    # must stay off in favour of the hand-rolled pgvector StatefulSet (see README).
    librechat-rag-api:
      enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
