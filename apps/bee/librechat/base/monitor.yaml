---
# LibreChat's built-in /metrics endpoint requires `Authorization: Bearer <METRICS_SECRET>`; the
# token is generated by the bootstrap Job in secrets.yaml and lives in `librechat-credentials-env`.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: librechat
  namespace: librechat
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: librechat
      app.kubernetes.io/instance: librechat
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
      authorization:
        type: Bearer
        credentials:
          name: librechat-credentials-env
          key: METRICS_SECRET
