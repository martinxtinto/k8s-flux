---
# LibreChat needs several long-lived secrets: session/crypto keys (CREDS_KEY, CREDS_IV, JWT_SECRET,
# JWT_REFRESH_SECRET, OPENID_SESSION_SECRET), the Meilisearch master key, the /metrics bearer token
# and the MongoDB root/app credentials. They are generated once and kept in Bitwarden Secrets
# Manager. Flow:
#   1. Job `librechat-secrets` creates the `librechat-secrets-bootstrap` Secret with freshly
#      generated random values (no-op if it already exists).
#   2. PushSecret pushes each value to Bitwarden, only if the remote item does not exist yet
#      (updatePolicy: IfNotExists), so an existing value is never overwritten.
#   3. ExternalSecrets pull the authoritative values back into `librechat-credentials-env` (consumed
#      by the HelmRelease) and into the MongoDB Secrets consumed by the StatefulSet.
# On a rebuilt cluster the Bitwarden items already exist, so nothing rotates and the app keeps its
# session keys. The one manually managed item is `librechat/openid-client-secret` (see below).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: librechat-secrets
  namespace: librechat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: librechat-secrets
  namespace: librechat
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - librechat-secrets-bootstrap
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: librechat-secrets
  namespace: librechat
subjects:
  - kind: ServiceAccount
    name: librechat-secrets
    namespace: librechat
roleRef:
  kind: Role
  name: librechat-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-secrets-script
  namespace: librechat
data:
  generate.py: |
    import base64
    import json
    import os
    import secrets
    import ssl
    import sys
    import urllib.error
    import urllib.request

    NAMESPACE = "librechat"
    SECRET_NAME = "librechat-secrets-bootstrap"

    # CREDS_KEY must be 32 bytes and CREDS_IV 16 bytes, both hex-encoded (LibreChat feeds them to
    # Buffer.from(value, "hex")); the rest are opaque tokens, where 32 random bytes are plenty.
    values = {
        "CREDS_KEY": secrets.token_hex(32),
        "CREDS_IV": secrets.token_hex(16),
        "JWT_SECRET": secrets.token_hex(32),
        "JWT_REFRESH_SECRET": secrets.token_hex(32),
        "OPENID_SESSION_SECRET": secrets.token_hex(32),
        "MEILI_MASTER_KEY": secrets.token_hex(32),
        "METRICS_SECRET": secrets.token_hex(32),
        "MONGO_ROOT_PASSWORD": secrets.token_hex(24),
        "MONGO_APP_PASSWORD": secrets.token_hex(24),
    }

    sa_dir = "/var/run/secrets/kubernetes.io/serviceaccount"
    token = open(os.path.join(sa_dir, "token"), encoding="utf-8").read().strip()
    host = os.environ["KUBERNETES_SERVICE_HOST"]
    port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
    api = f"https://{host}:{port}"
    context = ssl.create_default_context(cafile=os.path.join(sa_dir, "ca.crt"))
    headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

    def request(method, url, body=None):
        req = urllib.request.Request(url, data=body, method=method, headers=headers)
        return urllib.request.urlopen(req, context=context, timeout=30)

    secret_url = f"{api}/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}"

    # If the bootstrap secret already exists, leave it untouched so the pushed values are stable.
    try:
        request("GET", secret_url)
        print("bootstrap secret already exists; nothing to do")
        sys.exit(0)
    except urllib.error.HTTPError as err:
        if err.code != 404:
            raise

    body = json.dumps(
        {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": SECRET_NAME, "namespace": NAMESPACE},
            "type": "Opaque",
            "data": {key: base64.b64encode(value.encode()).decode() for key, value in values.items()},
        }
    ).encode()

    request("POST", f"{api}/api/v1/namespaces/{NAMESPACE}/secrets", body)
    print(f"created bootstrap secret {NAMESPACE}/{SECRET_NAME}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: librechat-secrets
  namespace: librechat
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: librechat-secrets
    spec:
      restartPolicy: OnFailure
      serviceAccountName: librechat-secrets
      # The main container receives a short-lived projected token explicitly (volume below) instead
      # of the auto-mounted one.
      automountServiceAccountToken: false
      containers:
        - name: create-secret
          image: python:3.13-alpine
          command:
            - python3
            - /scripts/generate.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: librechat-secrets-script
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: librechat-secrets
  namespace: librechat
spec:
  refreshInterval: 48h
  # Never overwrite an existing Bitwarden item.
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: bitwarden-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: librechat-secrets-bootstrap
  data:
    - match:
        secretKey: CREDS_KEY
        remoteRef:
          remoteKey: librechat/CREDS_KEY
    - match:
        secretKey: CREDS_IV
        remoteRef:
          remoteKey: librechat/CREDS_IV
    - match:
        secretKey: JWT_SECRET
        remoteRef:
          remoteKey: librechat/JWT_SECRET
    - match:
        secretKey: JWT_REFRESH_SECRET
        remoteRef:
          remoteKey: librechat/JWT_REFRESH_SECRET
    - match:
        secretKey: OPENID_SESSION_SECRET
        remoteRef:
          remoteKey: librechat/OPENID_SESSION_SECRET
    - match:
        secretKey: MEILI_MASTER_KEY
        remoteRef:
          remoteKey: librechat/MEILI_MASTER_KEY
    - match:
        secretKey: METRICS_SECRET
        remoteRef:
          remoteKey: librechat/METRICS_SECRET
    - match:
        secretKey: MONGO_ROOT_PASSWORD
        remoteRef:
          remoteKey: librechat/MONGO_ROOT_PASSWORD
    - match:
        secretKey: MONGO_APP_PASSWORD
        remoteRef:
          remoteKey: librechat/MONGO_APP_PASSWORD
---
# Consumed by the HelmRelease via global.librechat.existingSecretName and by the Meilisearch
# subchart via meilisearch.auth.existingMasterKeySecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-credentials
  namespace: librechat
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: librechat-credentials-env
  data:
    - secretKey: CREDS_KEY
      remoteRef:
        key: librechat/CREDS_KEY
    - secretKey: CREDS_IV
      remoteRef:
        key: librechat/CREDS_IV
    - secretKey: JWT_SECRET
      remoteRef:
        key: librechat/JWT_SECRET
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: librechat/JWT_REFRESH_SECRET
    - secretKey: OPENID_SESSION_SECRET
      remoteRef:
        key: librechat/OPENID_SESSION_SECRET
    - secretKey: MEILI_MASTER_KEY
      remoteRef:
        key: librechat/MEILI_MASTER_KEY
    - secretKey: METRICS_SECRET
      remoteRef:
        key: librechat/METRICS_SECRET
---
# `librechat/openid-client-secret` is created manually in Bitwarden from Kanidm's
# `kanidm system oauth2 show-basic-secret librechat` output. It owns a dedicated Secret instead
# of merging into `librechat-credentials-env`: a Merge target is never created by the controller,
# so a fresh install could lose the race against `librechat-credentials` and wait out the refresh
# interval. The Deployment requires this Secret via an explicit `OPENID_CLIENT_SECRET` env var.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-oidc
  namespace: librechat
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: librechat-oidc
  data:
    - secretKey: OPENID_CLIENT_SECRET
      remoteRef:
        key: librechat/openid-client-secret
---
# The StatefulSet reads the two Mongo passwords from this Secret directly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-mongodb
  namespace: librechat
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: librechat-mongodb
  data:
    - secretKey: root-password
      remoteRef:
        key: librechat/MONGO_ROOT_PASSWORD
    - secretKey: app-password
      remoteRef:
        key: librechat/MONGO_APP_PASSWORD
---
# Full MONGO_URI for LibreChat, composed here so the password exists only in this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-mongo-uri
  namespace: librechat
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: librechat-mongo-uri
    template:
      data:
        MONGO_URI: "mongodb://librechat:{{ .app_password }}@librechat-mongodb:27017/LibreChat?authSource=LibreChat"
  data:
    - secretKey: app_password
      remoteRef:
        key: librechat/MONGO_APP_PASSWORD
