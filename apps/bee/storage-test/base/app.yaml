---
apiVersion: v1
kind: Namespace
metadata:
  name: storage-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-local
  namespace: storage-test
spec:
  storageClassName: local
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-replicated
  namespace: storage-test
spec:
  storageClassName: replicated
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# ReadWriteMany filesystem volume: served over NFS by linstor-csi-nfs-server, needs a class with
# autoPlace >= 2.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-rwx
  namespace: storage-test
spec:
  storageClassName: replicated
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Gi
---
# One Deployment per volume, so the pinned `local` volume can't hold the `replicated` pod on its
# node. Each appends a line per pod start to /data/log: history survives restarts, and the node
# column shows where the pod ran.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-test-local
  namespace: storage-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: storage-test-local
  template:
    metadata:
      labels:
        app: storage-test-local
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: writer
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          echo "$(date -u +%FT%TZ) pod=$(hostname) node=$NODE_NAME" >> /data/log
          sleep infinity
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-test-replicated
  namespace: storage-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: storage-test-replicated
  template:
    metadata:
      labels:
        app: storage-test-replicated
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: writer
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          echo "$(date -u +%FT%TZ) pod=$(hostname) node=$NODE_NAME" >> /data/log
          sleep infinity
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-replicated
---
# Two pods, forced onto different nodes, sharing the one RWX volume. Each appends a line per
# start to /data/log, so either pod should show both pods' lines.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-test-rwx
  namespace: storage-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storage-test-rwx
  template:
    metadata:
      labels:
        app: storage-test-rwx
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: storage-test-rwx
            topologyKey: kubernetes.io/hostname
      containers:
      - name: writer
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          echo "$(date -u +%FT%TZ) pod=$(hostname) node=$NODE_NAME" >> /data/log
          sleep infinity
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-rwx
