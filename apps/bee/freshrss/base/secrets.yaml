---
# FreshRSS' OIDC support (mod_auth_openidc) needs the Kanidm client secret plus an opaque encryption
# passphrase for its session cache. Both are created manually in Bitwarden:
#   - `freshrss/oidc-client-secret`: the `kanidm system oauth2 show-basic-secret freshrss` output.
#   - `freshrss/oidc-crypto-key`: a random value (`openssl rand -hex 32`) that only has to be stable.
# The Deployment consumes the Secret as required environment variables, so the pod waits for it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: freshrss-oidc
  namespace: freshrss
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: freshrss-oidc
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: freshrss/oidc-client-secret
    - secretKey: OIDC_CLIENT_CRYPTO_KEY
      remoteRef:
        key: freshrss/oidc-crypto-key
