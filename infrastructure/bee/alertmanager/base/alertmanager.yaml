---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: monitoring
---
# Stable ClusterIP in front of the alertmanager-operated headless Service, so Prometheus can reach
# the Alertmanager API by name (`alertmanager.monitoring:9093`).
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9093
      targetPort: web
  selector:
    app.kubernetes.io/name: alertmanager
    alertmanager: alertmanager
---
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  retention: 120h
  serviceAccountName: alertmanager
  # Pick up AlertmanagerConfig resources from any namespace. With none present the operator renders a
  # default route with a null receiver; add receivers here or in an AlertmanagerConfig later.
  alertmanagerConfigSelector: {}
  alertmanagerConfigNamespaceSelector: {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: replicated
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 2000
