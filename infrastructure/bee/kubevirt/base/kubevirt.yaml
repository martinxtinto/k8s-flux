---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  infra:
    replicas: 1
  configuration:
    developerConfiguration:
      featureGates: []
    smbios:
      sku: "BeeCloud"
      version: "v0.0.1"
      manufacturer: "KubeVirt"
      product: "beevm"
      family: "bee"
  workloadUpdateStrategy:
    workloadUpdateMethods: []
  customizeComponents:
    patches:
      - resourceType: DaemonSet
        resourceName: virt-handler
        type: strategic
        patch: '{"spec":{"template":{"spec":{"volumes":[{"name":"kubelet-pods","hostPath":{"path":"/var/lib/k0s/kubelet/pods"}}]}}}}'
