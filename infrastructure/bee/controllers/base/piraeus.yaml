---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: piraeus-operator
  namespace: flux-system
spec:
  interval: 24h
  url: oci://ghcr.io/piraeusdatastore/piraeus-operator/piraeus
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "2.11.0"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: linstor-cluster
  namespace: flux-system
spec:
  interval: 24h
  url: oci://ghcr.io/piraeusdatastore/helm-charts/linstor-cluster
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "1.2.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piraeus-operator
  namespace: flux-system
spec:
  releaseName: piraeus-operator
  interval: 24h
  targetNamespace: piraeus-datastore
  chartRef:
    kind: OCIRepository
    name: piraeus-operator
    namespace: flux-system
  install:
    createNamespace: true
  values:
    installCRDs: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linstor-cluster
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: piraeus-datastore
  dependsOn:
    - name: piraeus-operator
      namespace: flux-system
  chartRef:
    kind: OCIRepository
    name: linstor-cluster
    namespace: flux-system
  values: {}