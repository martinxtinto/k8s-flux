---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: bitwarden-sdk-server
  namespace: flux-system
spec:
  interval: 24h
  url: oci://ghcr.io/external-secrets/charts/bitwarden-sdk-server
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "v0.7.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden-sdk-server
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: external-secrets
  chartRef:
    kind: OCIRepository
    name: bitwarden-sdk-server
    namespace: flux-system
  values:
    image:
      tls:
        enabled: true
    # The server reads its TLS certificate only at startup. cert-manager renews `bitwarden-tls-certs`
    # (and the CA) every 60 days; Reloader then restarts the server so it serves the new
    # certificate, which external-secrets verifies against the renewed `bitwarden-ca-certs`.
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: bitwarden-tls-certs
