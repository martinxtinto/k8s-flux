---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: bitwarden-sdk-server
  namespace: flux-system
spec:
  interval: 24h
  url: oci://ghcr.io/external-secrets/charts/bitwarden-sdk-server
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "v0.7.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden-sdk-server
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: external-secrets
  chartRef:
    kind: OCIRepository
    name: bitwarden-sdk-server
    namespace: flux-system
  values:
    image:
      tls:
        enabled: true
