---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-state-metrics
  namespace: flux-system
spec:
  interval: 24h
  url: oci://ghcr.io/prometheus-community/charts/kube-state-metrics
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "8.6.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: monitoring
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics
    namespace: flux-system
  install:
    createNamespace: true
  values:
    fullnameOverride: kube-state-metrics
    # Default collectors minus `secrets`: kube-state-metrics never reads Secret values, and its RBAC
    # is generated from this list, so dropping `secrets` also removes the cluster-wide secrets
    # list/watch rule.
    collectors:
      - certificatesigningrequests
      - configmaps
      - cronjobs
      - daemonsets
      - deployments
      - endpointslices
      - horizontalpodautoscalers
      - ingresses
      - jobs
      - leases
      - limitranges
      - mutatingwebhookconfigurations
      - namespaces
      - networkpolicies
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - poddisruptionbudgets
      - pods
      - replicasets
      - replicationcontrollers
      - resourcequotas
      - services
      - statefulsets
      - storageclasses
      - validatingwebhookconfigurations
      - volumeattachments
    # Object/workload state: Deployments, StatefulSets, Pods, PVCs, Nodes, Jobs, etc.
    prometheus:
      monitor:
        enabled: true
        namespace: monitoring
        interval: 30s
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi
