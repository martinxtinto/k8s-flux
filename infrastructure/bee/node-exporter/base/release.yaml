---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: prometheus-node-exporter
  namespace: flux-system
spec:
  interval: 24h
  url: oci://ghcr.io/prometheus-community/charts/prometheus-node-exporter
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "4.59.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: monitoring
  chartRef:
    kind: OCIRepository
    name: prometheus-node-exporter
    namespace: flux-system
  install:
    createNamespace: true
  values:
    fullnameOverride: node-exporter
    # One node-exporter per node; exposes CPU, memory, filesystem, network and pressure metrics.
    prometheus:
      monitor:
        enabled: true
        namespace: monitoring
        interval: 30s
    resources:
      requests:
        cpu: 20m
        memory: 16Mi
      limits:
        memory: 64Mi
    tolerations:
      - operator: Exists
        effect: NoSchedule
