---
# Starter dashboard. The Grafana sidecar watches ConfigMaps labelled grafana_dashboard and provisions
# them. More dashboards can be imported from grafana.com by ID (e.g. 1860 Node Exporter Full,
# 13332 kube-state-metrics) or added as further ConfigMaps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-bee-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  bee-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Node CPU usage",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "custom": { "drawStyle": "line", "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Node memory usage",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "custom": { "drawStyle": "line", "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Filesystem usage",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "custom": { "drawStyle": "line", "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|ramfs|fuse.lxcfs|squashfs|vfat\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|ramfs|fuse.lxcfs|squashfs|vfat\"}) * 100",
              "legendFormat": "{{instance}} {{mountpoint}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Node load (1m)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "node_load1", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pod CPU usage",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Pod memory working set",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\"})",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Nodes up",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 24 },
          "fieldConfig": { "defaults": { "mappings": [] }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(up{job=\"node-exporter\"})", "legendFormat": "up" }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Running pods",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 24 },
          "fieldConfig": { "defaults": { "mappings": [] }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "legendFormat": "running" }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["bee", "kubernetes"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "bee - Nodes & Workloads",
      "uid": "bee-overview",
      "version": 1,
      "weekStart": ""
    }
