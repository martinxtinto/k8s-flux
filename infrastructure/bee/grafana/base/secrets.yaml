---
# Grafana admin credentials are generated once with the Bitwarden Password Manager CLI and then
# stored in Bitwarden Secrets Manager. Flow:
#   1. Job `grafana-passphrase` runs `bw generate -p --words 3 --separator "." --includeNumber -c`
#      in an init container (the native bw binary is downloaded from the pinned GitHub release and
#      checksum-verified); the passphrase is written to a shared volume and the main container
#      creates the `grafana-admin-bootstrap` Secret (no-op if it already exists).
#   2. PushSecret pushes the value to Bitwarden, only if `grafana-admin/password` does not exist yet
#      (updatePolicy: IfNotExists), so an existing value is never overwritten.
#   3. ExternalSecret pulls the authoritative value back into `grafana-admin` for the Grafana chart.
# On a rebuilt cluster the Bitwarden item already exists, so the passphrase stays the same.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-passphrase
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-passphrase
  namespace: monitoring
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - grafana-admin-bootstrap
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-passphrase
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: grafana-passphrase
    namespace: monitoring
roleRef:
  kind: Role
  name: grafana-passphrase
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-passphrase-script
  namespace: monitoring
data:
  generate.py: |
    import base64
    import json
    import os
    import ssl
    import sys
    import urllib.error
    import urllib.request

    NAMESPACE = "monitoring"
    SECRET_NAME = "grafana-admin-bootstrap"

    with open("/work/password", encoding="utf-8") as fh:
        passphrase = fh.read().strip()
    if not passphrase:
        raise SystemExit("empty passphrase from generator")

    sa_dir = "/var/run/secrets/kubernetes.io/serviceaccount"
    token = open(os.path.join(sa_dir, "token"), encoding="utf-8").read().strip()
    host = os.environ["KUBERNETES_SERVICE_HOST"]
    port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
    api = f"https://{host}:{port}"
    context = ssl.create_default_context(cafile=os.path.join(sa_dir, "ca.crt"))
    headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

    def request(method, url, body=None):
        req = urllib.request.Request(url, data=body, method=method, headers=headers)
        return urllib.request.urlopen(req, context=context, timeout=30)

    secret_url = f"{api}/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET_NAME}"

    # If the bootstrap secret already exists, leave it untouched so the pushed value is stable.
    try:
        request("GET", secret_url)
        print("bootstrap secret already exists; nothing to do")
        sys.exit(0)
    except urllib.error.HTTPError as err:
        if err.code != 404:
            raise

    body = json.dumps(
        {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": SECRET_NAME, "namespace": NAMESPACE},
            "type": "Opaque",
            "data": {"password": base64.b64encode(passphrase.encode()).decode()},
        }
    ).encode()

    request("POST", f"{api}/api/v1/namespaces/{NAMESPACE}/secrets", body)
    print(f"created bootstrap secret {NAMESPACE}/{SECRET_NAME}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-passphrase
  namespace: monitoring
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-passphrase
    spec:
      restartPolicy: OnFailure
      serviceAccountName: grafana-passphrase
      # The init container runs as root (apt) and executes a downloaded binary, so it is not given a
      # service-account token. The main container receives a short-lived projected token explicitly
      # (volume below) instead of the auto-mounted one.
      automountServiceAccountToken: false
      # The passphrase is generated with the Bitwarden Password Manager CLI (`bw`), which Bitwarden
      # ships only as a native binary (no official image). The init container downloads the pinned
      # release, verifies its checksum, and writes the passphrase to the shared `work` volume. It
      # runs as root only to install curl/unzip via apt; the main container stays hardened.
      initContainers:
        - name: generate-passphrase
          image: debian:bookworm-slim
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl unzip
              curl -fsSL -o /tmp/bw.zip \
                "https://github.com/bitwarden/clients/releases/download/cli-v${BW_VERSION}/bw-linux-${BW_VERSION}.zip"
              echo "${BW_SHA256}  /tmp/bw.zip" | sha256sum -c -
              unzip -q -o /tmp/bw.zip -d /tmp/bw
              BW_BIN="$(find /tmp/bw -type f -name bw | head -1)"
              chmod +x "$BW_BIN"
              "$BW_BIN" generate -p --words 3 --separator "." --includeNumber -c > /work/password
          env:
            - name: BW_VERSION
              value: "2026.9.0"
            - name: BW_SHA256
              value: "580c1deec8345b19dbac7f8b02babb6cc4fe250c69c567e29061f727f1e40768"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        - name: create-secret
          image: python:3.13-alpine
          command:
            - python3
            - /scripts/generate.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: grafana-passphrase-script
        - name: work
          emptyDir: {}
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 48h
  # Never overwrite an existing Bitwarden item.
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: bitwarden-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: grafana-admin-bootstrap
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: grafana-admin/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana-admin/password
