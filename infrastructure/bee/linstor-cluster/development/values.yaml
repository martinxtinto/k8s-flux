apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linstor-cluster
spec:
  values:
    linstorSatelliteConfigurations:
      - name: replicated
        storagePools:
          - name: pool-0
            lvmThinPool:
              volumeGroup: linstor-pool-0
            source:
              hostDevices:
                - /dev/disk/by-path/virtio-pci-0000:06:00.0
