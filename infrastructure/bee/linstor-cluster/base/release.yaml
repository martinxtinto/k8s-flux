---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: linstor-cluster
  namespace: flux-system
spec:
  interval: 24h
  url: oci://ghcr.io/piraeusdatastore/helm-charts/linstor-cluster
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: "1.2.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linstor-cluster
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: piraeus-datastore
  chartRef:
    kind: OCIRepository
    name: linstor-cluster
    namespace: flux-system
  values:
    # Prometheus Operator integration: LINSTOR controller/satellite metrics, DRBD alert rules and
    # the "Piraeus Datastore" Grafana dashboard (dashboard enabled by default). Prometheus already
    # discovers monitors/rules in all namespaces, so no Prometheus changes are needed.
    monitoring:
      enabled: true
    linstorCluster:
      csiNode:
        enabled: true
        podTemplate:
          spec:
            containers:
              - name: linstor-csi
                volumeMounts:
                - mountPath: /var/lib/k0s/kubelet
                  name: publish-dir
                  mountPropagation: Bidirectional
              - name: csi-node-driver-registrar
                env:
                  - name: KUBELET_REGISTRATION_PATH
                    value: /var/lib/k0s/kubelet/plugins/linstor.csi.linbit.com/csi.sock
            volumes:
            - name: publish-dir
              hostPath:
                path: /var/lib/k0s/kubelet
            - name: registration-dir
              hostPath:
                path: /var/lib/k0s/kubelet/plugins_registry
            - name: plugin-dir
              hostPath:
                  path: /var/lib/k0s/kubelet/plugins/linstor.csi.linbit.com
    # Retain everywhere: deleting a PVC never destroys data. Released PVs (and their LINSTOR
    # resources) have to be removed by hand. autoPlace is the number of copies.
    storageClasses:
      # single copy, on the node where the pod is first scheduled
      - name: local
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
        reclaimPolicy: Retain
        allowVolumeExpansion: true
        volumeBindingMode: WaitForFirstConsumer
        provisioner: linstor.csi.linbit.com
        parameters:
          linstor.csi.linbit.com/autoPlace: "1"
          linstor.csi.linbit.com/storagePool: pool-0
          linstor.csi.linbit.com/allowRemoteVolumeAccess: "false"
      # two copies, one per node
      - name: replicated
        reclaimPolicy: Retain
        allowVolumeExpansion: true
        volumeBindingMode: WaitForFirstConsumer
        provisioner: linstor.csi.linbit.com
        parameters:
          linstor.csi.linbit.com/autoPlace: "2"
          linstor.csi.linbit.com/storagePool: pool-0
          linstor.csi.linbit.com/allowRemoteVolumeAccess: "false"
