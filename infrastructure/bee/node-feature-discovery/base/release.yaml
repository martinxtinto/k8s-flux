---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: node-feature-discovery
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/node-feature-discovery/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: flux-system
spec:
  interval: 24h
  targetNamespace: node-feature-discovery
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.19.0
      sourceRef:
        kind: HelmRepository
        name: node-feature-discovery
        namespace: flux-system
      interval: 24h
  values:
    # The worker needs to run everywhere; the control-plane nodes in bee carry no
    # taints but tolerate any added later.
    worker:
      tolerations:
        - operator: Exists
          effect: NoSchedule
