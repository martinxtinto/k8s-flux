---
# Intel GPU detection rule, trimmed from the upstream set at
# https://github.com/intel/intel-device-plugins-for-kubernetes/blob/v0.37.1/deployments/nfd/overlays/node-feature-rules/node-feature-rules.yaml
# NFD labels nodes that expose an Intel display/3D or accelerator-class GPU driven
# by i915 (Beelink S12 Pro / N100) or xe. The GpuDevicePlugin CR selects on this label.
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: intel-gpu
spec:
  rules:
    - name: "intel.gpu"
      labels:
        "intel.feature.node.kubernetes.io/gpu": "true"
      matchAny:
        # Display/3D class GPUs with i915 or xe
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: {op: In, value: ["8086"]}
                class: {op: In, value: ["0300", "0380"]}
            - feature: kernel.enabledmodule
              matchName: {op: In, value: ["i915", "xe"]}
        # Processing-accelerator class GPUs (xe only)
        - matchFeatures:
            - feature: pci.device
              matchExpressions:
                vendor: {op: In, value: ["8086"]}
                class: {op: In, value: ["1200"]}
                device: {op: In, value: ["674c", "674d", "674e", "674f", "6750", "6751"]}
            - feature: kernel.enabledmodule
              matchExpressions:
                xe: {op: Exists}
