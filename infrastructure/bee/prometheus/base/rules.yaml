---
# Alert rules for node health (node-exporter), Kubernetes object health (kube-state-metrics) and
# kubelet/cAdvisor. Application teams can add their own PrometheusRules; the Prometheus instance
# discovers PrometheusRules in every namespace.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-and-workload-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  groups:
    - name: node.rules
      rules:
        - alert: NodeDown
          expr: up{job="node-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node exporter on {{ $labels.instance }} is down"
            description: "No metrics are being scraped from {{ $labels.instance }} for 5 minutes; the node may be down or unreachable."
        - alert: NodeHighCpuUsage
          expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[5m])) * 100) > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on {{ $labels.instance }}"
            description: "CPU usage on {{ $labels.instance }} has been above 85% for 15 minutes (current: {{ printf \"%.1f\" $value }}%)."
        - alert: NodeHighMemoryUsage
          expr: (1 - node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) * 100 > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ $labels.instance }}"
            description: "Memory usage on {{ $labels.instance }} has been above 90% for 15 minutes (current: {{ printf \"%.1f\" $value }}%)."
        - alert: NodeFilesystemAlmostFull
          expr: (node_filesystem_avail_bytes{job="node-exporter", fstype!~"tmpfs|ramfs|fuse.lxcfs|squashfs|vfat"} / node_filesystem_size_bytes{job="node-exporter", fstype!~"tmpfs|ramfs|fuse.lxcfs|squashfs|vfat"}) * 100 < 15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Filesystem {{ $labels.device }} on {{ $labels.instance }} is almost full"
            description: "Filesystem {{ $labels.device }} mounted at {{ $labels.mountpoint }} has less than 15% free space (current: {{ printf \"%.1f\" $value }}%)."
    - name: kubernetes.rules
      rules:
        - alert: KubeletDown
          expr: up{job="kubelet"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Kubelet on {{ $labels.instance }} is down"
            description: "Kubelet metrics on {{ $labels.instance }} have not been scraped for 10 minutes."
        - alert: KubeNodeNotReady
          expr: kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not ready"
            description: "Node {{ $labels.node }} has been not ready for 15 minutes."
        - alert: KubePodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff."
        - alert: KubePodNotReady
          expr: sum by (namespace, pod) (max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"})) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for 15 minutes."
        - alert: KubeDeploymentReplicasMismatch
          expr: kube_deployment_spec_replicas{job="kube-state-metrics"} != kube_deployment_status_replicas_available{job="kube-state-metrics"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} does not have the desired number of available replicas."
        - alert: KubeStatefulSetReplicasMismatch
          expr: kube_statefulset_status_replicas_ready{job="kube-state-metrics"} != kube_statefulset_status_replicas{job="kube-state-metrics"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has unready replicas"
            description: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} does not have the desired number of ready replicas."
        - alert: KubeContainerOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}:{{ $labels.container }} was OOMKilled"
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} was terminated because it exceeded its memory limit."
        - alert: KubePersistentVolumeFillingUp
          expr: (kubelet_volume_stats_available_bytes{job="kubelet"} / kubelet_volume_stats_capacity_bytes{job="kubelet"}) * 100 < 15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PersistentVolumeClaim {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is almost full"
            description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 15% free space (current: {{ printf \"%.1f\" $value }}%)."
    - name: monitoring.rules
      rules:
        - alert: PrometheusTargetDown
          expr: up{job!~"node-exporter|kubelet|kube-state-metrics|apiserver|coredns"} == 0
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "Scrape target {{ $labels.job }} is down"
            description: "Target {{ $labels.instance }} for job {{ $labels.job }} has been down for 15 minutes."
